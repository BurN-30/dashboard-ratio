# docker-compose.yml
# Stack TrackBoard : DB + backend FastAPI + frontend Next.js.
# Le reverse proxy HTTPS est gere PAR LE HOST (nginx ou Caddy installe sur la machine,
# pas dans le compose). Les containers exposent leurs ports sur 127.0.0.1 uniquement,
# le reverse proxy de l'hôte les sert ensuite.
#
# Routage côté nginx/caddy de l'hôte, en « même origine » (un seul vhost) :
#   /auth, /api, /scrapers, /hardware (WebSocket compris), /media/, /health
#                            -> 127.0.0.1:8000  (backend FastAPI)
#   tout le reste            -> 127.0.0.1:3000  (frontend Next.js)
# Pour servir le backend sur un autre domaine, définir NEXT_PUBLIC_API_URL
# avant de construire le frontend.
#
# Usage :
#   docker compose up -d
#   docker compose logs -f
#   docker compose build --no-cache frontend

services:
  # ===========================================
  # DATABASE - PostgreSQL
  # ===========================================
  db:
    image: postgres:16-alpine
    container_name: trackboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trackboard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trackboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # BACKEND - FastAPI
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackboard-backend
    # Plafond mémoire (Playwright/Chromium des scrapers) : sans swap, un emballement
    # tue le backend et non un autre service de l'hôte.
    mem_limit: 1500m
    memswap_limit: 1500m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - HW_AGENT_TOKEN=${HW_AGENT_TOKEN}
      - DOCS_ENABLED=${DOCS_ENABLED:-false}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-3600}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TRACKBOARD_URL=${TRACKBOARD_URL:-}
      - DOMAIN=${DOMAIN:-example.com}
      # Tracker credentials
      - GF_USER=${GF_USER}
      - GF_PASS=${GF_PASS}
      - GF_USERNAME=${GF_USERNAME}
      - TOS_USER=${TOS_USER}
      - TOS_PASS=${TOS_PASS}
      - TOS_USERNAME=${TOS_USERNAME}
      - TORR9_USER=${TORR9_USER}
      - TORR9_PASS=${TORR9_PASS}
      - TORR9_USERNAME=${TORR9_USERNAME}
      - GEMINI_USER=${GEMINI_USER}
      - GEMINI_PASS=${GEMINI_PASS}
      - GEMINI_USERNAME=${GEMINI_USERNAME}
      - YGG_USER=${YGG_USER}
      - YGG_PASS=${YGG_PASS}
      - YGG_USERNAME=${YGG_USERNAME}
      - C411_USER=${C411_USER}
      - C411_PASS=${C411_PASS}
      - C411_USERNAME=${C411_USERNAME}
      # Media services
      - MEDIA_PLEX_URL=${MEDIA_PLEX_URL}
      - MEDIA_PLEX_TOKEN=${MEDIA_PLEX_TOKEN}
      - MEDIA_RADARR_URL=${MEDIA_RADARR_URL}
      - MEDIA_RADARR_API_KEY=${MEDIA_RADARR_API_KEY}
      - MEDIA_SONARR_URL=${MEDIA_SONARR_URL}
      - MEDIA_SONARR_API_KEY=${MEDIA_SONARR_API_KEY}
      - MEDIA_TAUTULLI_URL=${MEDIA_TAUTULLI_URL}
      - MEDIA_TAUTULLI_API_KEY=${MEDIA_TAUTULLI_API_KEY}
    volumes:
      - cookies-data:/app/cookies
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # FRONTEND - Next.js
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL du backend appelée depuis le navigateur (figée au build de Next).
        # Vide (défaut) : même origine, un seul vhost route /auth, /api, /scrapers,
        # /hardware, /media/ et /health vers le backend, le reste vers le frontend.
        # À renseigner seulement si le backend est servi sur un autre domaine.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_TRACKER_USERNAME=${TRACKER_USERNAME:-}
    container_name: trackboard-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  cookies-data:
